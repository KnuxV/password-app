[project]
name = "password-app"
version = "0.1.0"
description = "Strong password generator — docs, CI/CD and a Streamlit app (course example)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.66.0",
    "zxcvbn>=4.5.0",
]

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# also run the examples written in the docstrings (doctest)
addopts = "--doctest-modules --ignore=app.py"
pythonpath = ["."]
